<!doctype html><html lang="ps" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123047"><title>Javid AHMADI</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Javid AHMADI</h1><p>د مشتریانو حساب کتاب</p></header><main><section class="stats"><div>ټول پاتې پور<strong id="due">۰</strong></div><div>مشتریان<strong id="count">۰</strong></div><div>نن ورکړل شوی لوډ<strong id="todayLoad">۰</strong></div><div>نن ترلاسه شوې پیسې<strong id="todayPaid">۰</strong></div></section><section><h2>نوی مشتری</h2><input id="name" placeholder="د مشتری نوم"><input id="phone" placeholder="موبایل نمبر"><button id="add">مشتری اضافه کړه</button></section><section><h2>نوې معامله</h2><select id="customer"><option value="">مشتری انتخاب کړه</option></select><input id="amount" type="number" min="1" placeholder="مبلغ"><select id="type"><option value="load">لوډ / ما پیسې ورکړې (پور زیاتوي)</option><option value="paid">مشتري پیسې راکړې (پور کموي)</option></select><input id="note" placeholder="یادښت (اختیاري)"><button id="save">معامله ثبت کړه</button></section><section><h2>د معاملو تاریخچه</h2><input id="filter" type="date"><div id="history"></div></section><section><h2>د مشتریانو حسابونه</h2><div id="list"></div></section><button class="secondary" id="export">CSV بیک اپ ښکته کړه</button></main><script src="app.js"></script></body></html>
